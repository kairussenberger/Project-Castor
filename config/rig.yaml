# Physical + control configuration for the bimanual humanoid teleop rig.
#
# COORDINATE FRAME (robot world): +Z up, +Y operator/robot right, and -X forward.
# This matches vr.frames.WEBXR_TO_WORLD: WebXR +x(right)->world +Y,
# +y(up)->world +Z, and -z(forward)->world -X. Each YAM base pose below is in this
# world frame; the runtime maps headset/body-relative wrist displacement into each
# arm's base frame before IK.

# The real rig: an AgileX Ranger 60x60 stand carrying two 5-DoF i2rt YAM arms
# (the 6th DoF is replaced by the ORCA hand mount). Geometry is from a friend's
# CAD: arm base poses ICP-registered (RMS ~1.3-1.6 mm), stand feet on the floor.
stand:
  pos: [0.0, 0.0, 0.2475]       # lifts the AgileX frame so its feet sit on z=0

arms:
  # 6-DoF YAM. base_pos/base_quat (quat = w x y z) place the arm base on the
  # stand's Y-face plates; hand_pos/hand_euler are the measured flange→ORCA-hand
  # transform; neutral_q is the home pose (j1=±90° → arms face forward, world −X).
  left:
    can_channel: can0                  # LEFT arm currently enumerates on can0 (2026-06-14). gs_usb can0/can1 can flip on replug — if a scan shows the wrong arm, swap these two can_channel lines.
    base_pos: [-0.0248, -0.1700, 1.1908]   # Kai c2814b4: +0.5m on the real elongated stand (0.69->1.19)
    base_quat: [0.49791, 0.50194, -0.50011, -0.50004]
    hand_pos: [-0.0504, 0.1078, 0.0]   # flange (link5) → ORCA hand base
    hand_euler: [0.0, 3.14159, 0.0]    # palm-down, thumb-inward at home
    neutral_q: [3.137, -0.004, 0.305, -0.162, -0.003, -1.571]   # FROZEN official rest pose — see docs/RESTING_POSE.md, DO NOT CHANGE. ragdoll hang + j6 -90° palm-inward
  right:
    can_channel: can1                  # RIGHT arm currently enumerates on can1 (2026-06-14)
    base_pos: [0.0101, 0.0801, 1.1875]   # Kai c2814b4: +0.5m on the real elongated stand (0.69->1.19)
    base_quat: [0.49989, 0.49988, 0.50055, 0.49968]
    hand_pos: [-0.0306, 0.1078, 0.0]
    hand_euler: [0.0, 0.0, 0.0]
    neutral_q: [3.14, -0.001, 0.305, -0.152, 0.001, 1.571]   # FROZEN official rest pose — see docs/RESTING_POSE.md, DO NOT CHANGE. ragdoll hang + j6 +90° palm-inward
  # YAM joint limits (rad). j1-j5 from the URDF; j6 (wrist roll) = i2rt YAM ±2.0944.
  joint_limits:
    lower: [0.0, -2.879793, -1.396263, -1.570796, -1.570796, -2.0944]
    upper: [6.283185, 0.436332, 2.443461, 1.570796, 1.570796, 2.0944]

hands:
  left:  { model_name: orcahand_left }
  right: { model_name: orcahand_right }

control:
  arm_hz: 120        # headless IK/control rate (real YAM CAN loop target: 200-250 on Linux)
  hand_hz: 60        # finger retarget rate
  vr_hz: 72          # expected Quest stream rate

ik:
  pos_cost: 1.0
  ori_cost: 1.0      # orientation-stage weight (stage 2 solves j4-j6 to match the hand orientation)
  posture_cost: 0.01 # gentle null-space regularization (damped-LS already avoids buckling)
  lm_damping: 1.0e-2 # damped least squares (singularity robustness)
  max_vel: 12.0      # rad/s per joint — fast tracking (sim; tune down for real hardware)
  iters: 6           # IK steps per control tick — snappier convergence, less lag
  # SOFT joint limits = home ± this margin (rad). Caps each joint near home so the
  # arm physically cannot fold into a buckle (the elbow floor below is the primary
  # anti-buckle guard; hard limits always apply). Sized from measured IK excursions
  # over the absolute-mapping front-of-body workspace (max |q-home| ≈
  # [2.4, 0.65, 1.4, 0.5, 1.55, 0.5]) plus headroom — the old near-rest margins
  # pinned j1/j3/j5 and made chest-height targets unreachable. Re-tighten for
  # initial hardware sessions if desired.
  soft_margin: [2.8, 1.6, 1.7, 1.4, 1.55, 1.7]   # 6 joints (j6 = wrist roll)
  # Human-plausible ELBOW (j3) floor: j3 bends both ways from its straightest (home),
  # but only +j3 is anatomical flexion; below this it swings the forearm outward into
  # the dislocated-looking "overextension". Validate with scripts/run_synthetic.py
  # and the Unity render stream before hardware sessions.
  elbow_min: 0.20
  solver: daqp

mapping:
  # Position: 'absolute' maps your torso→wrist vector 1:1 (×pos_scale) onto the
  # robot's chest→wrist vector — hands held in front of YOU put the robot's hands
  # in front of IT. On (re)engage the arm GLIDES onto that correspondence over
  # engage_blend_s (snap-free); displacements map 1:1 from the first instant.
  # 'relative' = legacy clutch deltas about the engage anchor.
  # Orientation always uses the SAME body→world axis map (calibration-free):
  # rotate your hand about a body axis and the EE rotates about the matching world axis.
  position_mode: absolute
  body_anchor_world: null   # robot chest point (world); null = midpoint of the arm bases, dropped by body_anchor_drop
  body_anchor_drop: 0.15    # m below the base plates (shoulder line) for the default chest anchor
  engage_blend_s: 1.0       # seconds to glide from the current EE onto the absolute target
  # Orientation: 'absolute' = the robot hand WEARS your hand's attitude (mapped
  # through the body↔world axes + a derived hand↔EE convention), gliding on
  # (re)engage like position — the dashboard overlay skeleton and the ORCA hand
  # coincide by construction. 'relative' = clutch-latched deltas (then twist_mode
  # below applies).
  orientation_mode: absolute
  # Hand-local axes, PER SIDE — the two hands are mirrored anatomically (x flips
  # sign) and the old single shared constants were measured once on a desk and
  # sat 21° (fingers) / 45° (palm) off, mis-mapping every commanded attitude
  # (rolls leaked into j4/j5 swing). Re-measured 2026-06-11 from THREE real
  # sessions: 14.7k tracked frames, 4-5° scatter, left/right agree as mirrors.
  hand_finger_axis:                          # hand-local fingers direction
    left:  [-0.023, -0.225, -0.974]
    right: [0.024, -0.237, -0.971]
  hand_palm_axis:                            # hand-local back-of-hand normal
    left:  [-0.171, 0.961, -0.217]
    right: [0.175, 0.958, -0.229]
  # Wrist twist (RELATIVE orientation mode only): 'intrinsic' = pronation about
  # YOUR forearm axis is a pure j6 roll about the EE's own tool axis (no j4/j5
  # singularity contortion); 'world' = fully extrinsic (diagnostics).
  twist_mode: intrinsic
  # Forearm/roll axis in the ORBIT hand frame, PER SIDE (mirror pair, like the
  # finger/palm axes above). Measured from fast-rotation samples across the
  # same sessions; the old shared [0, 0.456, 0.890] was ~10° off.
  hand_twist_axis:
    left:  [0.10, 0.32, 0.94]
    right: [-0.02, 0.30, 0.95]
  pos_scale: 1.0
  # Operator NEUTRAL-POSE calibration (position-only; orientation is calibration-
  # free by contract). robot_neutral_wrist = where each wrist should sit, in body
  # coords [right, up, forward] (m) relative to the chest anchor, when the operator
  # holds the calibration pose (both arms extended straight forward at shoulder
  # height). Probed 2026-06-11 with the real IK: comfortable max forward reach is
  # ~0.52 m at lateral ±0.22 — neutral is set at ~90% of that, so the operator's
  # full natural extension maps to near-full robot extension.
  robot_neutral_wrist:
    left:  [-0.22, 0.02, 0.46]
    right: [0.22, 0.02, 0.46]
  # The robot's REST pose wrists in the same body coords (FK of neutral_q vs the
  # chest anchor) — pose B of the TWO-POSE calibration (arms relaxed at the
  # sides). Scales come from pose-A−pose-B DIFFERENCES, so the ORBIT recenter
  # anchor (which shifts all hand positions by an arbitrary vector — measured
  # 0.5 m after a desk-start) cancels exactly.
  robot_rest_wrist:
    left:  [-0.221, -0.437, -0.032]
    right: [0.222, -0.440, 0.032]
  # Pose C of the calibration (palms pressed together in front of the chest)
  # anchors the LATERAL map at contact width: the operator's measured clap gap
  # maps to this commanded wrist separation — sized so the capsule guard
  # (safety.hand_min_separation) leaves the rendered palms just touching.
  robot_clap_gap: 0.12
  # Where the fitted scale/offset is persisted (per-machine, gitignored — like
  # config/viz_calib.json). Auto-loaded on engine start for LIVE transports only
  # (orbit/vuer); fake/replay stay identity so the acceptance gate and the session
  # scorer stay deterministic.
  calib_file: config/operator_calib.json
  # Legacy manual mapper trim (euler xyz, rad). In body_relative mode the runtime
  # installs the measured body->base mapping at calibration time; leave these at zero
  # unless you explicitly disable body_relative for diagnostics.
  r_base_from_vr_euler:
    left:  [0.0, 0.0, 0.0]
    right: [0.0, 0.0, 0.0]
  # Per-side abduction sign for finger spread (flip if fingers splay the wrong way).
  abd_mirror:
    left: false
    right: true

safety:
  staleness_s: 0.15   # VR sample older than this -> not fresh (hold/ramp)
  hold_s: 0.3         # on VR loss while engaged: hold last, then ramp to neutral
  # Pairwise hand guard: each hand is a CAPSULE from the wrist hand_capsule_len
  # metres toward the fingertips; the minimum distance between the two capsules
  # (or vs a parked arm's capsule) is kept ≥ hand_min_separation by pushing the
  # wrist targets apart along the closest-point line. Clapping brings the hands
  # to CONTACT distance — palms, fingers, or fingertips-to-palm — never through.
  hand_min_separation: 0.12
  hand_capsule_len: 0.19
  # LINK-vs-LINK + LINK-vs-TORSO avoidance (safety/separation chains + engine.
  # _separate_arms). The hand guard above only protects the wrist→fingertip
  # capsules; with BOTH arms live the FOREARMS/ELBOWS/UPPER-ARMS can collide while
  # the hands are far apart, and either arm can drive into the central stand —
  # neither was guarded before (ik.py: "cross-arm collision is mitigated upstream"
  # had NO link-vs-link check). Each arm is modeled as a CHAIN OF CAPSULES from
  # its live IK link polyline (base→j1..j6→ee, ArmIK.link_points mapped to world
  # like the render sink), each segment a capsule of radius arm_link_radius. Every
  # tick, after the hand guard, each ENGAGED side's chain is kept ≥
  # arm_min_separation (SURFACE distance = centerline gap − 2·arm_link_radius)
  # from the OTHER arm's chain (a parked arm is a FIXED obstacle, like the hand
  # guard) and from the torso column; violations push that side's wrist TARGET
  # along the closest-point axis and re-solve (the shaper/IK still clamp).
  arm_min_separation: 0.06    # m surface gap kept between the two arm link chains
  arm_link_radius: 0.045      # m capsule radius around each arm link segment (YAM link half-thickness + margin)
  # AUTO-HOME collision buffer (hardware.drive_to_rest / scripts/home_arm.py). When
  # an off-rest arm is auto-driven BACK to rest, its FK link chain is sampled along
  # the joint-space glide vs the torso column (safety.torso) AND the other wired arm
  # (at its measured pose); if the SURFACE clearance to either drops below this, the
  # homing HOLDS its last safe command (no lurch, no torque release) and aborts
  # instead of pushing through. Same capsule radii as the live arm-vs-torso guard
  # (arm_link_radius + torso.radius). 0.03 m keeps a 3 cm buffer off the obstacle.
  home_clearance: 0.03        # m surface buffer the homing glide keeps from torso/other arm
  # Predict-correct passes per tick (the chain geometry needs the SOLVED config,
  # so each pass re-solves the IK from the adjusted wrist target). Pushing the
  # wrist target by the surface deficit only moves a MID-CHAIN colliding link
  # (forearm/elbow) fractionally, so a deep approach closes Gauss-Seidel style
  # over several passes; ~5 fully resolves a forearm-into-torso reach. The loop
  # breaks early when no side is pushed, so far-apart arms cost nothing extra.
  arm_sep_passes: 5
  # The TORSO/STAND as a static capsule obstacle: a vertical column near the rig
  # CENTER that neither arm may drive into. Placed from the measured geometry —
  # the two arm bases sit on the stand's Y-face plates at the SHOULDER line
  # (z≈1.19; midpoint of arms.left/right.base_pos = [-0.007, -0.045, 1.189]), and
  # the AgileX frame top is at stand.pos z (0.2475). So the column runs from the
  # shoulder line straight DOWN to the stand base at that center XY. radius 0.09 m
  # wraps the stand uprights/electronics box; min_separation 0.05 m is the surface
  # gap kept (centerline gap − arm_link_radius − torso.radius). Adjust p0/p1 if the
  # stand body or a payload occupies more space.
  torso:
    p0: [-0.007, -0.045, 1.19]   # top of the column — the shoulder line between the two arm bases
    p1: [-0.007, -0.045, 0.25]   # bottom — the AgileX stand base (stand.pos z)
    radius: 0.09                 # m around the central stand body
    min_separation: 0.05         # m surface gap kept between any arm link and the torso column
    # The arm's first link (base→j1) IS the rigid stand mount (sits ~12.6 cm from
    # the column by construction; the wrist target can never move it). Skip this
    # many leading chain points for the TORSO check so the mount geometry is not
    # flagged as a collision (arm-vs-arm keeps the whole chain). 1 = drop base→j1.
    skip_base_links: 1
  # Motion guardrails (sim AND the gateway to hardware). Every cap below is per
  # SECOND of wall-clock time (integrated with the real dt), NOT per frame — the
  # governed motion is identical at any loop/headset rate, so what the sim shows
  # is what the real frame does.
  # - target_speed_max / target_ang_speed_max cap how fast the commanded EE
  #   target may translate/rotate (operator p99 measured ≈2 m/s).
  # - target_accel_max / target_ang_accel_max bound ACCELERATION too: the
  #   governor is a critically-damped second-order tracker, so a demand leaves
  #   as a smooth S-curve (velocity ramps in, cruises, lands without overshoot)
  #   instead of the old rectangle-velocity "blocky" glide. Trades a little lag
  #   (~5 cm at 0.3 m/s following) for smooth, hardware-friendly motion.
  #   No-overshoot bound: keep accel ≥ 0.37·speed_max·(2π·smooth_hz); the
  #   values below carry ≥1.3× margin.
  # - target_jump_speed: implied speeds above this are NOT movements (tracking
  #   glitches measured 58–65 m/s) — the mapper re-anchors and the arm GLIDES;
  #   the violent motion simply never happens.
  # - sim_rate_limit / sim_smooth_hz / sim_accel_limit: the hardware-style joint
  #   command shaper now ALSO runs in the sim/render path — published joints can
  #   never move (or jerk) faster than this, whatever the IK does (singularity
  #   flips leave as bounded glides). Set sim_rate_limit to hardware.rate_limit
  #   (1.2) for exact real-robot motion parity before a hardware day.
  target_speed_max: 0.8
  target_accel_max: 5.0       # m/s² — ramps to full speed in ~0.16 s
  target_smooth_hz: 2.0       # position tracker bandwidth (critically damped)
  target_jump_speed: 3.0
  target_ang_speed_max: 2.5
  target_ang_accel_max: 25.0  # rad/s² — ramps to full turn rate in ~0.1 s
  # RUNTIME hardware safety monitor (safety/runtime_guard.py @ HardwareSink): runs
  # EVERY tick during a real session, on top of the 13 existing failsafes. Any trip
  # releases torque on all arms and aborts the run. Tuned conservatively for the
  # bring-up speeds; raise deliberately as you raise rate_limit / max_vel_scale.
  runtime:
    enabled: true
    # ABSOLUTE per-joint speed ceiling (rad/s). hardware.rate_limit (and --rate-limit
    # / jog --max-deg-s) are clamped DOWN to this — the arm can NEVER move faster than
    # this no matter what any config, CLI flag, or dashboard control asks. 1.5 rad/s
    # ≈ 86°/s; the bring-up rate_limit (1.2) already sits under it.
    hard_max_joint_speed: 1.5
    # TRACKING trip: commanded−measured gap (rad, shortest arc) that means a joint
    # stopped following — snag, stall, collision, motor fault. PER-JOINT, because the
    # gains differ hugely (kp [80,80,80,40,10,10]): MEASURED on metal 2026-06-13 the
    # weak wrist-roll j6 lags ~29° at 0.2x and 83° at 1x DURING A NORMAL ROLL, while
    # the strong shoulder (j1–j3) tracks to a few degrees. So: tight on j1–j3 (a real
    # collision there opens a gap fast), generous on j4, effectively off on the weak
    # j5/j6 (they physically cannot track a fast roll; only a ~180° sign-flip trips).
    #                     j1   j2   j3   j4   j5   j6
    max_tracking_error: [0.6, 0.6, 0.6, 1.4, 3.0, 3.0]   # rad  (34/34/34/80/172/172°)
    tracking_grace_s: 1.0       # ignore the gap for this long after start (engage glide)
    tracking_trip_s: 0.5        # gap must persist this long to trip (debounce)
    # THERMAL / OVERCURRENT trips, read from the motors each tick (yam_chain.read).
    max_motor_temp_c: 75.0      # MOSFET °C ceiling (thermal was a known-unknown)
    # |effort| ceiling. MEASURED on metal 2026-06-13: j1 (shoulder) draws ~8.0 just
    # HOLDING the arm against gravity (sideways mount), so the old 8.0 tripped on
    # every engage. 25.0 sits ~3x above the gravity-hold so only a genuine stall /
    # hard collision trips; the motor's own current limit is the hardware backstop.
    max_motor_current: 25.0
    # LOOP-STALL: wall-clock since the previous tick over this ⇒ the loop hung.
    loop_stall_s: 0.5
    warn_fraction: 0.8          # log a warning at this fraction of any limit
  # Mid-session ANCHOR-JUMP guard (safety/anchor_guard.py): a recenter, app
  # restart, or headset sleep moves the ORBIT stream anchors and silently
  # invalidates the applied calibration — the guard watches the body-relative
  # wrist signal for coherent discontinuities and a dead stream, locks follow,
  # and demands a recalibration. Thresholds sized from 19 real sessions
  # (2026-06-11): normal per-frame deltas p99 < 3 cm; one-frame tracking
  # glitches of 0.2–1.5 m are common (absorbed by confirm_frames + the
  # other-hand cross-check); benign stream hiccups measured ≤ 0.9 s.
  anchor_guard:
    enabled: true
    jump_m: 0.25            # one-sample discontinuity beyond this + speed_allow*dt = suspect
    speed_allow: 4.0        # m/s honest-motion allowance (scales with the sample gap)
    confirm_frames: 3       # consecutive far samples to confirm (~27 ms at 110 Hz)
    return_tol: 0.10        # m — snap back within this of pre-jump = glitch, resume
    coherence_tol: 0.15     # m — both-side jump similarity = shared-anchor event
    max_sample_gap_s: 0.3   # continuity expires across longer per-side gaps (dropout)
    blackout_s: 2.0         # live transports: whole stream dead this long → trip
  # Attitude tracker bandwidth: raw Quest wrist quats carry ~200°/s of
  # high-frequency jitter (worse when the palm rotates away from the cameras);
  # the second-order tracker rolls it off at −40 dB/decade. target_ori_smooth_hz
  # sets the bandwidth directly; if absent it derives from the legacy
  # target_ori_smooth_s first-order τ (ω = 2/τ, matching the old settle time).
  target_ori_smooth_s: 0.12
  sim_rate_limit: 1.8
  sim_smooth_hz: 4.0
  sim_accel_limit: 25.0   # rad/s² joint accel cap (no-overshoot needs ≥ 0.37·rate·2π·hz ≈ 17)
  workspace:          # axis-aligned EE target bounds in arm base frame (m)
    min: [-0.6, -0.85, -0.6]   # y-min lowered: arms-down home wrist sits at base-y≈-0.56;
    max: [0.6, 0.7, 0.6]       # old -0.2 clipped it +0.36m on engage -> arms curled to center

# HARDWARE REPLAY governor (safety/replay_drive.py @ run_hw --vr replay). A
# recording is a stream of ABSOLUTE IK targets; played at the tape's own rate they
# outrun the gravity-loaded, speed-derated, shaped arm, the RuntimeGuard TRACKING
# gap (safety.runtime.max_tracking_error) opens past its ceiling, and the run dies.
# The ReplayConductor closes the loop: it FREEZES the replay clock at the
# trajectory start and lets the arm glide onto it (converge), then advances the
# clock only as fast as the metal tracks. The clock RATE SCALE is driven by the
# worst per-joint tracking RATIO (gap[j]/max_tracking_error[j] — the same quantity
# the guard trips on): full rate at/below soft_frac, ramping linearly to a frozen
# clock at hard_frac, so the gap is held WELL under 1.0 and the trip is never
# reached by lag alone. A genuine trip is caught, the shapers reseed from the
# measured pose, and playback re-converges (it never aborts). Affects ONLY
# run_hw --vr replay; live teleop and sim/run_teleop replay are untouched.
replay:
  converge_tol: 0.10        # rad — worst-joint command↔measured gap that counts as "on the start pose"
  converge_hold_s: 0.4      # s — the gap must stay within converge_tol this long before following begins
  converge_timeout_s: 20.0  # s — never converged by now: follow anyway, flagged converge_timed_out (do NOT abort)
  soft_frac: 0.5            # ratio at/below which the tape plays at full rate (scale 1)
  hard_frac: 0.85           # ratio at/above which the clock is frozen (scale 0); ramps linearly between

# Hardware-boundary safety (run_hw / HardwareSink). These act ON TOP of the IK
# velocity limits and joint hardstops — the shaper is the last line of defense:
# every CAN command is limit-clamped, speed-capped, and PD-smoothed, gliding from
# the arm's MEASURED pose at startup (this supersedes the old ramp_s soft-start).
hardware:
  max_vel_scale: 0.35 # derate ik.max_vel for real motors (sim keeps full speed)
  rate_limit: 1.2     # rad/s hard per-joint speed cap at the CAN boundary
  smooth_hz: 3.0      # critically-damped command tracker bandwidth (the "PD" feel)
  accel_limit: 12.0   # rad/s² per-joint accel cap — velocity RAMPS, never slams
                      # (no-overshoot needs ≥ 0.37·rate·2π·hz ≈ 8.4; 1.4× margin)
  # AUTO-HOME to rest. When an arm is OFF rest at session start (rest-pose gate
  # below would otherwise REFUSE to start), gently drive it BACK to the rest pose
  # by itself — shaped/rate-limited through the same JointCommandShaper, runtime
  # guard ACTIVE every tick — instead of refusing and waiting for a human to
  # reposition it. The target IS the official gravity hang, so this is the safest
  # motion the arm can make. ONLY done when every joint is within auto_home_max of
  # rest; a GROSS deviation (wrong arm on the bus, or a huge map error) is still
  # ABORTED so a human looks at it. Opt-in (the code default is OFF → byte-identical
  # legacy refuse-and-raise behaviour); this flag turns it on for this rig.
  auto_home_to_rest: false   # HELD OFF pending verification. The collision-aware drive_to_rest is in the tree but NOT yet confirmed safe on metal — it re-enabled itself prematurely and rammed the torso. Re-enable ONLY after the safety review passes AND a careful e-stop-ready test. Until then: position the arm by hand.
  #                j1   j2   j3   j4   j5   j6   max rad off-rest we will auto-drive
  auto_home_max: [0.8, 0.8, 0.8, 0.8, 2.0, 2.0]   # to rest, else abort. j6 wrong-arm
                      # is ~π=180° ≫ 2.0 so a WRONG ARM still refuses; a harmless ±2π
                      # boot-wrap reads ~0 via shortest-arc and stays well within.
  auto_home_timeout_s: 20.0   # give up driving to rest after this (then still refuse)
  # Which arms are physically wired — ONLY these are opened/commanded; the
  # engine's output for other sides is dropped at the sink. Add 'left' when its
  # CAN adapter is connected (and verified with hw_bringup --step scan).
  sides: [right]   # SINGLE ARM (2026-06-14): reverted from [left, right] — two live arms + flippable gs_usb channels applied the wrong-sign map to the wrong arm and slammed j3 under run_hw. Re-add 'left' only after the CAN channels are locked (config/99-yam-can.rules) and each arm re-verified separately.
  # ORCA hands: RealHand MOVES the hand to neutral at connect — keep false until
  # the hands are mounted, tensioned, and on their serial buses.
  use_hands: false
  # Rest-pose engage gate, PER JOINT (rad): a session refuses to start unless each
  # wired arm MEASURES at the official resting pose (docs/RESTING_POSE.md) through
  # its calibrated joint map. The limp WRIST (j5/j6) rolls freely and settles 40–60°
  # off every torque release, while the gravity-loaded shoulder (j1–j3) always hangs
  # at the same place — so a single tolerance is wrong: tight enough for the shoulder
  # rejects every normal wrist drift (which then drove operators to RE-ANCHOR a
  # cocked pose and corrupt the map → the arm lifted). Per-joint fixes it: tight on
  # j1–j4 (catches a real not-at-rest / wrong-arm start), loose on the freely-drifting
  # j5/j6 (still catches a π wrong-arm flip — 180° ≫ 69°). No re-anchoring needed for
  # normal drift; the clean map just works.
  #                  j1    j2    j3    j4    j5    j6
  engage_pose_tol: [0.30, 0.30, 0.30, 0.30, 1.20, 1.20]   # rad (17/17/17/17/69/69°) — loosened j1-j4 2026-06-14 so a slightly-drifted hang still engages; still ≪ wrong-arm (180°)/±2π so those are caught
  # Per-machine motor↔model joint calibration written by scripts/hw_bringup.py
  # (signs measured on metal; offsets anchored at the resting pose). Gitignored.
  joint_map_file: config/hw_joint_map.json

vr:
  transport: fake     # 'fake' (synthetic, no headset) or 'vuer' (real Quest WebXR)
  render_endpoint: tcp://127.0.0.1:8101       # ZMQ/msgpack render.state stream
  unity_json_endpoint: tcp://127.0.0.1:8102   # plain TCP newline JSON for Unity
  body_relative: true # arm IK sees wrist relative to current head/body frame, not raw XR-world hand position
  torso_from_head: [0.0, -0.35, 0.0] # body-frame torso proxy from headset: right, up, forward (m)
  calib_seconds: 0.0  # arm mapping is calibration-free; >0 re-enables the optional legacy startup stillness hold (only steers arms when body_relative is false)
  cross_gap: 0.05     # min world-Y gap each hand keeps from center (anti-overlap guard, metres)
  control_port: 8201  # localhost TCP line-JSON engine commands (dashboard CALIBRATE button)
  # SAFETY: the operator's body frame yaw. 'locked' (default) = the forward
  # direction is LATCHED (from the calibration's arm-defined forward; before
  # that, from the first head sample) — looking left/right or taking the
  # headset off can NEVER move the arms (head position already cancels in the
  # body-relative subtraction; this removes head ROTATION too). 'head' = legacy
  # live head yaw (only sane for true-world sources like Vuer).
  body_yaw: locked
  # SAFETY: live transports (orbit/vuer) hold the arms at rest and ignore all
  # hand input until the operator completes the guided calibration IN THIS
  # SESSION — a fresh ORBIT recenter anchor makes any previous session's
  # absolute mapping untrustworthy. fake/replay are exempt (deterministic
  # tests/analysis). Set false to restore follow-on-startup.
  require_calibration: true
  # ORBIT streams the head floor-anchored but the wrists in a RECENTER-anchored
  # frame (and a recenter/desk-start moves that anchor arbitrarily — measured
  # +0.5 m once, breaking calibration). 'keypoint' rebuilds each wrist as
  # head_pos + hand keypoint[0] (keypoints are head-anchored, world axes) —
  # NO anchor assumption, recenter-proof. 'head' = legacy live-head re-anchor;
  # 'world' = raw passthrough.
  orbit_wrist_anchor: keypoint
  cert_file: cert.pem
  key_file: key.pem
  ngrok: false        # true to tunnel for the Quest browser
